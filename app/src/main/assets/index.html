<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>ZYE TOOLS</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#000; --panel:#0E0E0E; --panel-2:#141414;
  --border:rgba(255,255,255,.08); --border-strong:rgba(255,255,255,.18);
  --text:#fff; --text-dim:rgba(255,255,255,.55); --text-faint:rgba(255,255,255,.30);
  --purple:#A020F0; --purple-2:#7B2FFF; --success:#57FFA8; --danger:#FF5B5B;
  --radius:20px; --transition:cubic-bezier(.22,.61,.36,1);
  --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);
  font-family:'Inter',-apple-system,sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(circle at 50% 0%,rgba(160,32,240,.18) 0%,transparent 45%),
    radial-gradient(circle at 100% 100%,rgba(123,47,255,.10) 0%,transparent 50%),
    radial-gradient(circle at 0% 100%,rgba(160,32,240,.10) 0%,transparent 50%)}
#app{position:relative;z-index:1;min-height:100vh;max-width:460px;margin:0 auto;
  padding:calc(24px + var(--safe-top)) 18px calc(24px + var(--safe-bottom));
  display:flex;flex-direction:column}

/* SPLASH */
#splash{position:fixed;inset:0;z-index:9999;background:#000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
  transition:opacity .6s var(--transition),visibility .6s}
#splash.hide{opacity:0;visibility:hidden}
.splash-logo{width:96px;height:96px;border-radius:24px;
  background:linear-gradient(145deg,#1a1a1c,#060606);border:1px solid var(--border-strong);
  display:grid;place-items:center;font-weight:900;font-size:28px;color:#fff;
  box-shadow:0 0 60px rgba(160,32,240,.35),inset 0 1px 0 rgba(255,255,255,.12);
  animation:logoIn 1.2s var(--transition) both}
@keyframes logoIn{0%{opacity:0;transform:scale(.6)}60%{opacity:1;transform:scale(1.08)}100%{transform:scale(1)}}
.splash-title{font-size:16px;font-weight:800;letter-spacing:.32em;color:#fff;
  opacity:0;animation:fadeUp .8s var(--transition) .5s forwards}
.splash-sub{font-size:10px;font-weight:600;letter-spacing:.4em;color:var(--text-faint);
  opacity:0;animation:fadeUp .8s var(--transition) .7s forwards}
.splash-loader{width:140px;height:3px;border-radius:999px;background:rgba(255,255,255,.08);
  overflow:hidden;margin-top:20px;opacity:0;animation:fadeUp .6s var(--transition) .9s forwards}
.splash-loader::after{content:'';display:block;height:100%;width:40%;
  background:linear-gradient(90deg,var(--purple),var(--purple-2));border-radius:999px;
  animation:splashBar 1.4s ease-in-out infinite}
@keyframes splashBar{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.view{flex:1;display:none;flex-direction:column;animation:viewIn .5s var(--transition) both}
.view.active{display:flex}
@keyframes viewIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

/* LOGIN */
.login-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center}
.brand{text-align:center;margin-bottom:28px}
.brand-logo{width:88px;height:88px;margin:0 auto 16px;border-radius:22px;
  background:linear-gradient(145deg,#1a1a1c,#060606);border:1px solid var(--border-strong);
  display:grid;place-items:center;font-weight:900;font-size:26px;color:#fff;
  box-shadow:0 0 50px rgba(160,32,240,.4),inset 0 1px 0 rgba(255,255,255,.12)}
.brand-title{font-size:24px;font-weight:900;letter-spacing:.16em;
  background:linear-gradient(180deg,#fff 0%,var(--purple) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.brand-sub{margin-top:6px;font-size:10px;letter-spacing:.3em;color:var(--text-faint);font-weight:600}

.card{width:100%;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  padding:22px 20px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:0 20px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06)}
.field{margin-bottom:14px}
.field label{display:block;font-size:10px;font-weight:700;letter-spacing:.24em;
  color:var(--text-faint);margin-bottom:8px;text-transform:uppercase}
.field input{width:100%;height:54px;padding:0 16px;background:rgba(0,0,0,.55);
  border:1px solid var(--border);border-radius:14px;color:#fff;font-size:14px;
  font-family:inherit;outline:none;letter-spacing:.04em;
  transition:border-color .2s,background .2s,box-shadow .2s}
.field input::placeholder{color:rgba(255,255,255,.22)}
.field input:focus{border-color:var(--purple);background:rgba(0,0,0,.7);
  box-shadow:0 0 0 4px rgba(160,32,240,.15)}

.btn{width:100%;height:54px;border:none;border-radius:14px;font-family:inherit;
  font-size:13px;font-weight:800;letter-spacing:.18em;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  transition:transform .15s var(--transition),opacity .2s,box-shadow .2s;user-select:none}
.btn:active{transform:scale(.975)}
.btn[disabled]{opacity:.6;pointer-events:none}
.btn-primary{background:linear-gradient(135deg,var(--purple),var(--purple-2));color:#fff;
  box-shadow:0 10px 30px rgba(160,32,240,.35)}
.btn-danger{background:rgba(255,91,91,.1);color:#ff7b7b;border:1px solid rgba(255,91,91,.3)}
.btn .spinner{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.3);
  border-top-color:#fff;animation:spin .7s linear infinite;display:none}
.btn.loading .spinner{display:block}
.btn.loading .btn-label{display:none}
@keyframes spin{to{transform:rotate(360deg)}}

.login-footer{margin-top:20px;text-align:center;font-size:10px;letter-spacing:.22em;
  color:var(--text-faint);font-weight:600}

/* DASHBOARD */
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;padding:4px 4px 0}
.topbar-left{display:flex;align-items:center;gap:12px}
.mini-logo{width:42px;height:42px;border-radius:12px;
  background:linear-gradient(145deg,#1a1a1c,#060606);border:1px solid var(--border-strong);
  display:grid;place-items:center;font-weight:900;font-size:13px;color:#fff}
.topbar h1{font-size:15px;font-weight:800;letter-spacing:.18em}
.topbar .sub{font-size:9px;color:var(--text-faint);letter-spacing:.24em;margin-top:2px;font-weight:700}
.status-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;
  background:rgba(87,255,168,.08);border:1px solid rgba(87,255,168,.25);
  font-size:9px;font-weight:800;letter-spacing:.16em;color:var(--success)}
.status-chip .dot{width:6px;height:6px;border-radius:50%;background:var(--success);
  box-shadow:0 0 8px var(--success);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

.user-card{display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;background:var(--panel-2);border:1px solid var(--border);
  border-radius:14px;margin-bottom:16px}
.user-card .label{font-size:9px;letter-spacing:.24em;color:var(--text-faint);font-weight:700}
.user-card .value{font-size:13px;font-weight:700;color:#fff;margin-top:4px;word-break:break-all}
.avatar{width:42px;height:42px;border-radius:50%;
  background:linear-gradient(145deg,var(--purple),var(--purple-2));
  display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;flex-shrink:0;
  box-shadow:0 0 20px rgba(160,32,240,.4)}

.section-label{font-size:10px;letter-spacing:.28em;color:var(--text-faint);
  font-weight:800;margin:6px 4px 12px;text-transform:uppercase}

.feature{display:flex;align-items:center;justify-content:space-between;padding:18px;
  background:var(--panel);border:1px solid var(--border);border-radius:18px;
  margin-bottom:12px;transition:all .3s var(--transition);cursor:pointer}
.feature:active{transform:scale(.985)}
.feature.on{border-color:var(--purple);box-shadow:0 0 0 1px rgba(160,32,240,.2),0 8px 32px rgba(160,32,240,.2)}
.feature-info{display:flex;flex-direction:column;gap:5px;flex:1}
.feature-name{font-size:14px;font-weight:800;letter-spacing:.16em;color:#fff}
.feature-state{font-size:10px;letter-spacing:.24em;font-weight:700;
  color:var(--text-faint);transition:color .3s}
.feature.on .feature-state{color:var(--purple)}
.toggle{position:relative;width:56px;height:32px;border-radius:999px;
  background:rgba(255,255,255,.08);border:1px solid var(--border);
  cursor:pointer;flex-shrink:0;margin-left:12px;transition:all .3s var(--transition)}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;
  border-radius:50%;background:#6a6a6a;transition:all .3s var(--transition);
  box-shadow:0 2px 6px rgba(0,0,0,.4)}
.toggle.on{background:linear-gradient(135deg,var(--purple),var(--purple-2));border-color:transparent}
.toggle.on::after{transform:translateX(24px);background:#fff}

.info-card{padding:16px;background:var(--panel-2);border:1px solid var(--border);
  border-radius:16px;margin-top:16px}
.info-row{display:flex;justify-content:space-between;padding:8px 0;font-size:11px}
.info-row + .info-row{border-top:1px solid var(--border)}
.info-key{color:var(--text-faint);letter-spacing:.16em;font-weight:700}
.info-val{color:#fff;font-weight:700;letter-spacing:.04em}

.logout-wrap{margin-top:20px}
.footer{margin-top:auto;padding-top:28px;text-align:center;font-size:10px;
  color:var(--text-faint);letter-spacing:.14em;font-weight:600;line-height:1.8}

#toast{position:fixed;left:50%;bottom:calc(30px + var(--safe-bottom));
  transform:translate(-50%,30px);background:rgba(20,20,22,.96);
  border:1px solid var(--border-strong);color:#fff;padding:13px 20px;border-radius:999px;
  font-size:11px;font-weight:700;letter-spacing:.1em;opacity:0;pointer-events:none;
  transition:opacity .28s,transform .32s var(--transition);z-index:9998;
  max-width:90vw;text-align:center;box-shadow:0 16px 40px rgba(0,0,0,.6)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.success{border-color:rgba(87,255,168,.5);color:#9DFFCE}
#toast.error{border-color:rgba(255,91,91,.5);color:#FF9B9B}
</style>
</head>
<body>

<div id="splash">
  <div class="splash-logo">ZYE</div>
  <div class="splash-title">ZYE TOOLS</div>
  <div class="splash-sub">PREMIUM EDITION</div>
  <div class="splash-loader"></div>
</div>

<div id="app">

  <!-- LOGIN -->
  <section class="view active" id="view-login">
    <div class="login-wrap">
      <div class="brand">
        <div class="brand-logo">ZYE</div>
        <div class="brand-title">ZYE TOOLS</div>
        <div class="brand-sub">PREMIUM EDITION</div>
      </div>

      <form class="card" id="login-form" autocomplete="off" novalidate>
        <div class="field">
          <label for="login-user">Username</label>
          <input id="login-user" type="text"
                 autocapitalize="none" autocorrect="off" spellcheck="false"
                 placeholder="Masukkan username" required />
        </div>
        <div class="field">
          <label for="login-pass">Password</label>
          <input id="login-pass" type="password"
                 autocapitalize="none" autocorrect="off" spellcheck="false"
                 placeholder="Masukkan password" required />
        </div>
        <button type="submit" class="btn btn-primary" id="btn-login">
          <span class="spinner"></span>
          <span class="btn-label">LOGIN</span>
        </button>
      </form>

      <div class="login-footer">©ZyeCitedz · v1.0</div>
    </div>
  </section>

  <!-- DASHBOARD -->
  <section class="view" id="view-dashboard">
    <header class="topbar">
      <div class="topbar-left">
        <div class="mini-logo">ZYE</div>
        <div>
          <h1>ZYE TOOLS</h1>
          <div class="sub">CONTROL PANEL</div>
        </div>
      </div>
      <div class="status-chip"><span class="dot"></span>ACTIVE</div>
    </header>

    <div class="user-card">
      <div>
        <div class="label">LOGGED IN AS</div>
        <div class="value" id="user-name">—</div>
      </div>
      <div class="avatar" id="user-avatar">Z</div>
    </div>

    <div class="section-label">Fitur</div>

    <div class="feature" id="feature-panel">
      <div class="feature-info">
        <div class="feature-name">FLOATING PANEL</div>
        <div class="feature-state">STATUS: OFF</div>
      </div>
      <div class="toggle" id="toggle-panel"></div>
    </div>

    <div class="info-card">
      <div class="info-row"><span class="info-key">MAKER</span><span class="info-val">ZyeCitedz</span></div>
      <div class="info-row"><span class="info-key">NAME</span><span class="info-val">ZYE TOOLS</span></div>
      <div class="info-row"><span class="info-key">VERSION</span><span class="info-val">V1.0</span></div>
      <div class="info-row"><span class="info-key">SHIZUKU</span><span class="info-val" id="shizuku-status">-</span></div>
    </div>

    <div class="logout-wrap">
      <button class="btn btn-danger" id="btn-logout" type="button">
        <span class="btn-label">LOGOUT</span>
      </button>
    </div>

    <div class="footer">ZYE TOOLS · V1.0<br/>©ZyeCitedz</div>
  </section>

</div>

<div id="toast"></div>

<script>
(() => {
  'use strict';

  // ============================================================
  // AKUN VALID — Username + Password (ALL DEVICE, unlimited)
  // Tambahkan akun baru di sini sesuai keinginan
  // ============================================================
  const VALID_ACCOUNTS = [
    { u: 'ZYE-VIP-2026',     p: 'HYR-7K2M-X91P'  },
    { u: 'ZYE-PREMIUM-01',   p: 'ZYE-A8N4-R72Q'  },
    { u: 'HYR-INJECT-V2',    p: 'KEY-5P1K-T94M'  },
    { u: 'ZYE-CITER-X1',     p: 'VIP-8L3J-W62N'  },
    { u: 'KAIZYE-USER-07',   p: 'HYR-9F5D-M28Z'  },
    { u: 'ZYE-GACOR-99',     p: 'PREM-3B7V-C46T' },
    { u: 'ZYE-PRO-USER',     p: 'ZYE-2Q9X-N75K'  },
    { u: 'HYR-VIP-INJECT',   p: 'HYR-6R4M-P38L'  },
    { u: 'ZYE-MASTER-01',    p: 'VIP-1Z8K-Q92W'  },
    { u: 'ZYE-ELITE-X',      p: 'ZYE-7M5T-B64N'  },
    { u: 'ZYE-OWNER-Z1',     p: 'HYR-4V2P-R81Q'  },
    { u: 'ZYE-HYPER-77',     p: 'PREM-9K6D-S27X' },
    { u: 'ZYE-CITEDZ-VIP',   p: 'ZYE-3L8N-C51M'  },
    { u: 'ZYE-LEGEND-X',     p: 'HYR-8P4T-W63K'  },
    { u: 'ZYE-SULTAN-01',    p: 'VIP-5N2R-Q94L'  },
    { u: 'ZYE-RAJA-VIP',     p: 'ZYE-6K7M-X28P'  },
    { u: 'ZYE-KING-PRO',     p: 'HYR-2Q5V-N71T'  },
    { u: 'ZYE-BOS-BESAR',    p: 'PREM-4L9D-C36M' },
    { u: 'ZYE-PREMIUM-X',    p: 'ZYE-7R3K-W85N'  },
    { u: 'ZYE-ULTIMATE',     p: 'HYR-1M8P-Q47L'  }
  ];

  const SESSION_KEY = 'zye_session';

  const $ = (id) => document.getElementById(id);
  const splash = $('splash');
  const viewLogin = $('view-login');
  const viewDashboard = $('view-dashboard');
  const loginForm = $('login-form');
  const inputUser = $('login-user');
  const inputPass = $('login-pass');
  const btnLogin = $('btn-login');
  const userNameEl = $('user-name');
  const userAvatarEl = $('user-avatar');
  const featurePanel = $('feature-panel');
  const togglePanel = $('toggle-panel');
  const btnLogout = $('btn-logout');
  const shizukuStatus = $('shizuku-status');
  const toastEl = $('toast');

  const AndroidBridge = window.AndroidBridge || null;
  let currentUser = '';

  // SPLASH
  window.addEventListener('load', () => {
    setTimeout(() => splash.classList.add('hide'), 2000);
  });

  // TOAST
  let toastTimer;
  function toast(msg, type = 'default') {
    toastEl.textContent = msg;
    toastEl.classList.remove('success', 'error');
    if (type) toastEl.classList.add(type);
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2400);
  }

  // VIEW
  function showView(target) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    target.classList.add('active');
    window.scrollTo(0, 0);
  }

  // SESSION
  function saveSession(data) {
    try { sessionStorage.setItem(SESSION_KEY, JSON.stringify(data)); } catch (_) {}
  }
  function loadSession() {
    try {
      const raw = sessionStorage.getItem(SESSION_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (_) { return null; }
  }
  function clearSession() {
    try { sessionStorage.removeItem(SESSION_KEY); } catch (_) {}
  }

  // CARI AKUN
  function findAccount(username, password) {
    return VALID_ACCOUNTS.find(a => a.u === username && a.p === password);
  }

  // LOGIN
  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (btnLogin.classList.contains('loading')) return;

    const username = inputUser.value.trim().toUpperCase();
    const password = inputPass.value.trim().toUpperCase();

    if (!username || !password) {
      toast('ISI USERNAME DAN PASSWORD', 'error');
      return;
    }

    btnLogin.classList.add('loading');
    btnLogin.disabled = true;

    await new Promise(r => setTimeout(r, 1000));

    const acc = findAccount(username, password);
    if (!acc) {
      toast('USERNAME ATAU PASSWORD SALAH', 'error');
      btnLogin.classList.remove('loading');
      btnLogin.disabled = false;
      return;
    }

    currentUser = username;
    saveSession({ user: username });
    enterDashboard(username);
    toast('LOGIN BERHASIL', 'success');

    btnLogin.classList.remove('loading');
    btnLogin.disabled = false;
  });

  // DASHBOARD
  function enterDashboard(username) {
    userNameEl.textContent = username;
    userAvatarEl.textContent = username.charAt(0).toUpperCase();
    resetPanel();
    showView(viewDashboard);
    setTimeout(checkShizuku, 400);
  }

  function resetPanel() {
    featurePanel.classList.remove('on');
    togglePanel.classList.remove('on');
    featurePanel.querySelector('.feature-state').textContent = 'STATUS: OFF';
    updateFloatingWindow(false);
  }

  // FLOATING PANEL
  featurePanel.addEventListener('click', () => {
    const isOn = togglePanel.classList.toggle('on');
    featurePanel.classList.toggle('on', isOn);
    featurePanel.querySelector('.feature-state').textContent =
      'STATUS: ' + (isOn ? 'ACTIVE' : 'OFF');

    if (isOn) toast('FLOATING PANEL ON', 'success');
    else toast('FLOATING PANEL OFF');

    updateFloatingWindow(isOn);
  });

  function updateFloatingWindow(active) {
    if (!AndroidBridge || typeof AndroidBridge.updateFloatingWindow !== 'function') return;
    try { AndroidBridge.updateFloatingWindow(active ? '1' : '0'); } catch (_) {}
  }

  // SHIZUKU
  function checkShizuku() {
    if (!AndroidBridge || typeof AndroidBridge.getShizukuStatus !== 'function') {
      shizukuStatus.textContent = 'N/A';
      return;
    }
    try {
      const s = AndroidBridge.getShizukuStatus();
      if (s === 'CONNECTED') shizukuStatus.textContent = 'CONNECTED';
      else if (s === 'NOT_INSTALLED') shizukuStatus.textContent = 'NOT INSTALLED';
      else shizukuStatus.textContent = 'NOT CONNECTED';
    } catch (_) { shizukuStatus.textContent = 'ERROR'; }
  }

  // LOGOUT
  btnLogout.addEventListener('click', () => {
    clearSession();
    resetPanel();
    if (inputUser) inputUser.value = '';
    if (inputPass) inputPass.value = '';
    showView(viewLogin);
    toast('LOGOUT BERHASIL', 'success');
  });

  // AUTO RESUME
  window.addEventListener('DOMContentLoaded', () => {
    const s = loadSession();
    if (s && s.user) {
      currentUser = s.user;
      enterDashboard(s.user);
    }
  });
})();
</script>
</body>
</html>
