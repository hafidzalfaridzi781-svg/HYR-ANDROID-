<div class="section-label" style="margin-top:20px;">Display Tuning</div>

<!-- DPI -->
<div class="tune-card">
  <div class="tune-head">
    <div class="tune-title">DPI</div>
    <div class="tune-current">CURRENT: <span id="dpi-current">—</span></div>
  </div>
  <input type="number" id="input-dpi" class="tune-input" placeholder="Contoh: 420" min="120" max="700" />
  <div class="tune-buttons">
    <button class="btn btn-apply" id="btn-dpi-apply">APPLY</button>
    <button class="btn btn-reset" id="btn-dpi-reset">RESET</button>
  </div>
</div>

<!-- RESOLUTION -->
<div class="tune-card">
  <div class="tune-head">
    <div class="tune-title">RESOLUTION</div>
    <div class="tune-current">CURRENT: <span id="res-current">—</span></div>
  </div>
  <div class="tune-row">
    <input type="number" id="input-res-w" class="tune-input" placeholder="Width" min="320" max="4000" />
    <span class="tune-x">×</span>
    <input type="number" id="input-res-h" class="tune-input" placeholder="Height" min="480" max="4000" />
  </div>
  <div class="tune-buttons">
    <button class="btn btn-apply" id="btn-res-apply">APPLY</button>
    <button class="btn btn-reset" id="btn-res-reset">RESET</button>
  </div>
</div>

<div class="section-label" style="margin-top:20px;">Crosshair</div>

<!-- CROSSHAIR -->
<div class="tune-card">
  <div class="tune-head">
    <div class="tune-title">CROSSHAIR</div>
    <div class="toggle" id="toggle-crosshair"></div>
  </div>

  <div class="crosshair-label">BENTUK</div>
  <div class="ch-shapes" id="ch-shapes">
    <div class="ch-shape" data-shape="cross">+</div>
    <div class="ch-shape" data-shape="dot">•</div>
    <div class="ch-shape" data-shape="circle">○</div>
    <div class="ch-shape" data-shape="square">□</div>
    <div class="ch-shape" data-shape="triangle">△</div>
    <div class="ch-shape" data-shape="diamond">◇</div>
    <div class="ch-shape" data-shape="x">×</div>
    <div class="ch-shape" data-shape="tcross">T</div>
    <div class="ch-shape" data-shape="full_dot">●</div>
  </div>

  <div class="crosshair-label">WARNA</div>
  <div class="ch-colors" id="ch-colors">
    <div class="ch-color" data-color="#00FF00" style="background:#00FF00"></div>
    <div class="ch-color" data-color="#FF0000" style="background:#FF0000"></div>
    <div class="ch-color" data-color="#00BFFF" style="background:#00BFFF"></div>
    <div class="ch-color" data-color="#FFFFFF" style="background:#FFFFFF"></div>
    <div class="ch-color" data-color="#FF00FF" style="background:#FF00FF"></div>
    <div class="ch-color" data-color="#FFFF00" style="background:#FFFF00"></div>
  </div>

  <div class="crosshair-label">UKURAN: <span id="ch-size-val">60</span></div>
  <input type="range" id="ch-size" min="20" max="200" value="60" class="ch-slider" />
</div>
